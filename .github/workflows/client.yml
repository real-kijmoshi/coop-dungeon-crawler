name: client

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["client/**", ".github/workflows/client.yml"]
  workflow_dispatch:
  pull_request:
    paths: ["client/**", ".github/workflows/client.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build all platforms
        run: ./build.sh "${GITHUB_REF_NAME}"
      - name: Generate checksums
        run: cd dist && sha256sum cdc-* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cdc-clients
          path: client/dist/*
      - name: Attach binaries to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/dist/*
